<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- Installable app -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#00657B">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E1113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taranis">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taranis CRM">
<meta name="mobile-web-app-capable" content="yes">
<title>Taranis CRM</title>

<!--
  Content Security Policy.
  connect-src is deliberately narrow: the app may only talk to your own n8n
  gateway and your own Supabase project. Add nothing else here without a reason.
  Replace the two placeholder origins at deploy time (see deploy.yml).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  manifest-src 'self';
  worker-src 'self';
  connect-src 'self' https://quantcairo.app.n8n.cloud https://*.supabase.co wss://*.supabase.co;
  form-action 'none';
  frame-ancestors 'none';
  base-uri 'none';
">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=Inter:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Taranis CRM
   Display : GT Flexa Ext Rg     (falls back to Archivo Expanded)
   Body    : AktivGrotesk-Light  (falls back to Inter Light)
   Data    : IBM Plex Mono
   Palette : the Taranis brand swatches
   ============================================================ */

/* The licensed faces load from ./fonts/ if the files are present.
   If they are not, the browser silently uses the free stand-ins
   below and the layout is unaffected. */
@font-face{
  font-family:'GT Flexa Ext';
  src:url('./fonts/GT-Flexa-Expanded-Regular.woff2') format('woff2');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Aktiv Grotesk';
  src:url('./fonts/AktivGrotesk-Light.woff2') format('woff2');
  font-weight:300; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Aktiv Grotesk';
  src:url('./fonts/AktivGrotesk-Regular.woff2') format('woff2');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Aktiv Grotesk';
  src:url('./fonts/AktivGrotesk-Medium.woff2') format('woff2');
  font-weight:500 600; font-style:normal; font-display:swap;
}

:root{
  /* --- brand ------------------------------------------------ */
  --teal:#00657B;        /* deep teal   */
  --sky:#57C0D6;         /* mid cyan    */
  --sky-2:#6CCADE;       /* light cyan  */
  --ochre:#C48500;       /* amber       */
  --olive:#949362;       /* khaki       */

  /* --- surfaces & text -------------------------------------- */
  /* Body text sits on white, and #00657B alone is too light to
     read comfortably at 15px, so the ink is a darker cousin of it. */
  --ink:#052A33;
  --ink-2:#00657B;
  --ink-3:#5F8089;
  --paper:#F2F8F9;
  --card:#ffffff;
  --rule:#CDE2E7;
  --rule-2:#E5F1F3;

  /* --- states ------------------------------------------------ */
  --accent:#00657B;      --accent-soft:#DFEFF3;
  --good:#00657B;        --good-soft:#DFEFF3;
  --signal:#A97300;      --signal-soft:#FAF0DA;   /* ochre, darkened for contrast */
  --quiet:#7C7B4E;       --quiet-soft:#EFEFE4;    /* olive: screened out, not an error */
  /* The palette has no red, and a failure cannot be signalled in
     teal. This brick is mixed to sit beside the ochre. */
  --bad:#A6402E;         --bad-soft:#F9E9E5;

  --shadow:0 1px 2px rgba(5,42,51,.05),0 8px 24px -12px rgba(5,42,51,.22);
  --rail:44px;

  --font-display:'GT Flexa Ext','Archivo',system-ui,sans-serif;
  --font-stretch-display:118%;
  --font-body:'Aktiv Grotesk','Inter',system-ui,-apple-system,sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E6F2F4; --ink-2:#A4C6CE; --ink-3:#77969E;
    --paper:#032027; --card:#082D37; --rule:#134450; --rule-2:#0D3843;
    --accent:#6CCADE; --accent-soft:#0B3A46;
    --good:#6CCADE;   --good-soft:#0B3A46;
    --signal:#E0A64A; --signal-soft:#31270F;
    --quiet:#B5B37C;  --quiet-soft:#2A2A1A;
    --bad:#E08A76;    --bad-soft:#331812;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -12px rgba(0,0,0,.65);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body);
  font-weight:300;
  font-size:15px; font-weight:300; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}

/* ---------- The logo ---------- */
/* The supplied file, unaltered. It is drawn for dark backgrounds — the
   wordmark is near-white and the trefoil cyan — so it only ever sits on
   the brand black. Both places it appears are black for that reason. */
.wm{display:block;width:100%;height:auto;aspect-ratio:467/240;object-fit:contain}

/* ---------- Sign in: the brand cover ---------- */
#gate{
  position:fixed;inset:0;display:grid;place-items:center;z-index:100;padding:24px;
  background:
    radial-gradient(ellipse 560px 440px at 50% 44%,
      rgba(14,17,19,.94) 0%, rgba(14,17,19,.72) 46%, rgba(14,17,19,0) 100%),
    url('./brand-pattern.svg') center center / 1500px auto no-repeat,
    #0E1113;
  color:#F2F8F9;
}
.gate-card{width:100%;max-width:400px;text-align:center}
#gate .field span{color:#BBD3D9}
#gate .field input{
  background:rgba(255,255,255,.05);border-color:rgba(87,192,214,.35);color:#F2F8F9;
}
#gate .field input::placeholder{color:#6D858C}
#gate .field input:focus{border-color:var(--sky);background:rgba(255,255,255,.09);outline:none}
#gate .btn{background:var(--sky);border-color:var(--sky);color:#06232B}
#gate .btn:hover{background:var(--sky-2);border-color:var(--sky-2);opacity:1}
#gate .gate-note{color:#93AAB1}
#gate .linkish{color:var(--sky)}
#gate :focus-visible{outline-color:var(--sky)}
/* The mark spans the full card; the form stays a comfortable reading
   width underneath it, centred. */
.gate-mark{width:300px;max-width:76%;margin:0 auto 26px;display:block}
#gate .field,
#gate .btn,
#gate .gate-note{max-width:340px;margin-left:auto;margin-right:auto;text-align:left}
#gate .field{display:block}
.gate-sub{font-family:var(--font-data);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#7FA9B4;margin:0 0 36px;text-align:center}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;
  border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;
  transition:opacity .15s, transform .09s cubic-bezier(.22,.61,.36,1), box-shadow .15s;
  will-change:transform}
.btn:hover{opacity:.86;transform:translateY(-1px);box-shadow:0 3px 10px -4px rgba(5,42,51,.45)}
/* The press itself. Without this a click feels like nothing happened. */
.btn:active{transform:translateY(1px) scale(.985);box-shadow:none;transition-duration:.04s}
.btn:disabled{opacity:.5;transform:none;box-shadow:none;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-quiet{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn-quiet:hover{background:var(--rule-2);opacity:1}
.btn-sm{padding:5px 11px;font-size:13px}
.gate-note{margin-top:20px;font-size:13px;color:var(--ink-3);line-height:1.55}

/* ---------- Shell ---------- */
#app{display:none;height:100%}
#app.on{display:grid;grid-template-columns:248px 1fr;grid-template-rows:100%}

nav{
  scrollbar-width:thin;
  border-right:1px solid var(--rule);
  background:#0E1113 url('./brand-pattern.svg') center center / cover no-repeat;
  color:#DCE9EC;
  display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:20px 18px;border-bottom:1px solid rgba(87,192,214,.18);text-align:left}
.brand .wm{width:100%;max-width:none;margin:0}
@media (display-mode:standalone){
  nav{padding-top:env(safe-area-inset-top)}
  .head{padding-top:calc(22px + env(safe-area-inset-top))}
  #ask-bar{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}
.brand p{font-family:var(--font-data);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--sky);opacity:.75;margin:0;text-align:left;padding-left:2px}
.navlist{padding:12px 9px;flex:1}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;font-size:14.5px;color:#A9C3C9;margin-bottom:2px;transition:color .12s,background .12s}
.navbtn:hover{background:rgba(87,192,214,.10);color:#EAF5F7}
.navbtn[aria-current="page"]{background:rgba(87,192,214,.16);color:#7FD4E6;font-weight:600;box-shadow:inset 2px 0 0 var(--sky)}
.navbtn .ic{width:16px;text-align:center;font-size:13px;opacity:.8}
.navbtn .ct{margin-left:auto;font-family:var(--font-data);font-size:11px;background:var(--signal);color:#fff;padding:1px 6px;border-radius:9px;font-weight:600}
@media (prefers-color-scheme:dark){.navbtn .ct{color:#171b22}}
.navfoot{padding:13px;border-top:1px solid rgba(87,192,214,.18);font-size:12px;color:#7C979E;background:rgba(14,17,19,.72)}
.navfoot .who{display:block;color:#CBE2E7;font-weight:600;margin-bottom:3px;word-break:break-all}
.linkish{background:none;border:0;padding:0;color:var(--sky);cursor:pointer;font-size:12px;text-decoration:underline}

main{
  overflow-y:auto;display:flex;flex-direction:column;
  background:var(--paper) url('./brand-pattern-light.svg') right bottom / 130% auto no-repeat;
  background-attachment:local;
}
/* The sticky header needs to stay opaque or the cubes scroll through it. */
.head{background:var(--paper)}
.head{padding:22px 28px 15px;border-bottom:2px solid var(--sky);position:sticky;top:0;background:var(--paper);z-index:5}
.head h2{font-family:var(--font-display);font-stretch:118%;font-weight:300;letter-spacing:.012em;font-size:33px;margin:0;line-height:1.1;color:var(--ink-2)}
.head p{margin:5px 0 0;color:var(--ink-3);font-size:13.5px;max-width:64ch}
.body{padding:20px 28px 48px;flex:1;animation:arrive .22s cubic-bezier(.22,.61,.36,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.body{animation:none}
  .btn,.chip{transition:none}.btn:hover,.chip:hover{transform:none}}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}

/* ---------- Entry: action first, evidence indented in mono ---------- */
.entry{background:var(--card);position:relative;z-index:1;border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;display:grid;grid-template-columns:var(--rail) 1fr;overflow:hidden;box-shadow:var(--shadow)}
/* The rail is the one piece of chrome on every card, so it carries the
   lattice from the cover rather than being a flat grey strip. Sized large
   and cropped, so each card shows a different part of it. */
/* The rail is the one piece of chrome on every card, so it carries the
   cover artwork: the brand lattice on the sidebar black, cropped so each
   card shows a different part of it. The pattern was drawn as cyan lines
   for a dark ground, so it gets the dark ground rather than being washed
   out over a pale one. */
.entry-rail{border-right:1px solid rgba(87,192,214,.22);display:flex;flex-direction:column;
  align-items:center;padding:14px 0 10px;gap:7px;position:relative;overflow:hidden;
  background:#0E1113 url('./brand-pattern.svg') center center / 240px auto no-repeat}
.entry-rail>*{position:relative;z-index:1}
/* A tint over the artwork so the card's state still reads at a glance. */
.entry.bad .entry-rail{box-shadow:inset 3px 0 0 var(--bad)}
.entry.good .entry-rail{box-shadow:inset 3px 0 0 var(--good)}
.entry.signal .entry-rail{box-shadow:inset 3px 0 0 var(--signal)}
.entry.accent .entry-rail{box-shadow:inset 3px 0 0 var(--sky)}
.entry.quiet .entry-rail{box-shadow:inset 3px 0 0 var(--quiet)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.good{background:var(--good)} .dot.signal{background:var(--signal)} .dot.bad{background:var(--bad)}
.dot.accent{background:var(--sky)} .dot.quiet{background:var(--quiet)}
.rail-n{font-family:var(--font-data);font-size:10px;color:#8FB6C0;writing-mode:vertical-rl;letter-spacing:.06em}
/* The dot sits on black now, so it needs a ring to stay visible. */
.entry-rail .dot{box-shadow:0 0 0 3px rgba(14,17,19,.9)}
.entry-main{padding:14px 16px}
.entry-act{font-family:var(--font-display);font-stretch:112%;font-size:16px;font-weight:400;letter-spacing:.004em;margin:0 0 3px;line-height:1.35}
.entry-who{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.entry-who b{font-weight:600;color:var(--ink)}
.ev{font-family:var(--font-data);font-size:12px;color:var(--ink-2);line-height:1.65;padding-left:14px;border-left:2px solid var(--rule);margin:0}
.ev div{margin-bottom:1px}
.ev .k{color:var(--ink-3)}
.ev .gold{color:var(--signal);font-weight:700}
.ev .k{font-weight:600;color:var(--ink-3)}
/* The raw record from With Intelligence. Its labels carry the deep ink so
   they read as a field list rather than as more prose. */
.rec-head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  font-weight:600;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.ev.rec{border-left:0;padding-left:0}
.ev.rec .k{color:var(--ink);font-weight:700;opacity:1}
.ev.rec>div{color:var(--ink);line-height:1.75}
.callout{display:flex;gap:10px;align-items:baseline;margin:9px 0 4px;padding:9px 13px;
  border:1px solid var(--rule);border-left-width:3px;border-radius:5px;background:var(--card)}
.callout-k{font-family:var(--font-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.callout-v{font-size:14.5px;font-weight:600;line-height:1.45}
.callout.signal{border-left-color:var(--signal);background:var(--signal-soft)}
.callout.signal .callout-k{color:var(--signal);opacity:.85}
.callout.signal .callout-v{color:var(--signal)}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.bad .callout-v{color:var(--bad)}
.callout.good{border-left-color:var(--good);background:var(--good-soft)}
.entry.bad .ev .k{color:var(--bad);opacity:.8}
.entry.bad .ev{border-left-color:var(--bad)}
.acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tag{font-family:var(--font-data);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--rule-2);color:var(--ink-2);font-weight:500}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.signal{background:var(--signal-soft);color:var(--signal)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.quiet{background:var(--quiet-soft);color:var(--quiet)}

.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty p{margin:0 0 14px;font-size:14px}
.empty .big{font-family:var(--font-display);font-stretch:125%;letter-spacing:-.005em;font-size:22px;color:var(--ink-2);margin-bottom:6px}

/* ---------- Ask (chat) ---------- */
#ask-wrap{display:flex;flex-direction:column;height:100%}
#ask-log{flex:1;overflow-y:auto;padding:20px 28px 34px}
.msg{max-width:78ch;margin-bottom:18px}
.msg .from{font-family:var(--font-data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.msg.me{margin-left:auto}
.msg.me .bub{background:var(--accent-soft);border-color:transparent}
.bub{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:13px 15px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.6}
.bub b{font-weight:600}
.bub a{color:var(--accent)}
.srcs{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule-2);font-family:var(--font-data);font-size:11px;color:var(--ink-3)}
#ask-bar{border-top:1px solid var(--rule);padding:12px 28px 18px;background:var(--paper);position:sticky;bottom:0;z-index:5;box-shadow:0 -10px 18px -12px rgba(0,0,0,.35)}
#ask-row{display:flex;gap:8px;align-items:flex-end;max-width:900px}
#ask-in{flex:1;padding:11px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--card);resize:none;max-height:150px;font-size:14.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;max-width:900px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:14px;padding:4px 11px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);
  transition:border-color .15s, color .15s, transform .09s cubic-bezier(.22,.61,.36,1)}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.chip:active{transform:translateY(0) scale(.97);transition-duration:.04s}
.typing{display:inline-flex;gap:3px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- Compose / modal ---------- */
.sheet{position:fixed;inset:0;background:rgba(20,24,31,.42);display:none;place-items:center;z-index:60;padding:20px}
.sheet.on{display:grid}
.sheet-in{background:var(--card);border-radius:10px;max-width:620px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,.4)}
.sheet-hd{padding:18px 22px 12px;border-bottom:1px solid var(--rule-2)}
.sheet-hd h3{font-family:var(--font-display);font-stretch:118%;font-weight:300;letter-spacing:.012em;font-size:25px;margin:0}
.sheet-bd{padding:18px 22px}
.sheet-ft{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--rule-2)}
.ta{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);resize:vertical;min-height:150px;font-size:14px;line-height:1.6}

/* ---------- Toast ---------- */
#newver{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;z-index:95;
  background:var(--ink-2);color:#F2F8F9;padding:10px 12px 10px 18px;
  border-radius:8px;font-size:14px;box-shadow:0 10px 30px -8px rgba(5,42,51,.5);
  animation:rise .25s ease-out}
#newver button{
  background:var(--sky);color:#06232B;border:0;border-radius:6px;
  padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer}
#newver button:hover{background:var(--sky-2)}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(10px)}}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:7px;font-size:14px;z-index:90;transition:transform .22s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}

/* Documents upload */
.drop{border:1.5px dashed var(--rule);border-radius:10px;background:var(--card);padding:26px 20px;text-align:center;transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--sky);background:var(--accent-soft)}
.drop h4{font-family:var(--font-display);font-stretch:125%;font-weight:600;font-size:17px;margin:0 0 4px}
.drop p{margin:0;font-size:13px;color:var(--ink-3)}
.drop input[type=file]{display:none}
.picked{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:7px;padding:9px 13px;margin-top:10px;font-size:13.5px}
.picked .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picked .sz{font-family:var(--font-data);font-size:11.5px;color:var(--ink-3);margin-left:auto;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.bar{height:4px;background:var(--rule-2);border-radius:2px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--sky);width:0;transition:width .25s}

.banner{background:var(--signal-soft);border:1px solid var(--signal);color:var(--signal);padding:9px 14px;border-radius:6px;font-size:13px;margin-bottom:16px}
.banner b{font-weight:600}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  #app.on{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);align-items:center}
  .brand{border-bottom:0;border-right:1px solid rgba(87,192,214,.18);padding:10px 13px;flex:none}
  .brand .wm{width:92px;margin:0} .brand p{display:none}
  .navlist{display:flex;padding:8px;flex:none}
  .navbtn{white-space:nowrap;margin:0 1px 0 0}
  .navbtn .ic{display:none}
  .navfoot{display:none}
  .gate-mark{width:100%}
  .head{padding:16px 18px 12px} .head h2{font-size:24px}
  .body,#ask-log,#ask-bar{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>

<!-- ===================== SIGN IN ===================== -->
<div id="gate">
  <div class="gate-card">
    <h1 class="gate-mark"><img class="wm" src="./taranis-logo.png" alt="Taranis" width="467" height="240"></h1>
    <p class="gate-sub">Customer relationship management</p>
    <label class="field"><span>Work email</span>
      <input id="gate-email" type="email" autocomplete="username" placeholder="you@taranis.net"></label>
    <label class="field"><span>Password</span>
      <input id="gate-pass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="btn" id="gate-go" style="width:100%">Sign in</button>
    <p class="gate-note" id="gate-note">Only addresses on the allow list can sign in. Ask an admin if you need a password set.</p>
    <p class="gate-note"><button class="linkish" id="gate-demo">Open the sample console instead</button> — sample data, nothing connected.</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <nav>
    <div class="brand"><img class="wm" src="./taranis-logo.png" alt="Taranis" width="467" height="240"></div>
    <div class="navlist" id="navlist"></div>
    <div class="navfoot">
      <span class="who" id="who">—</span>
      <button class="linkish" id="signout">Sign out</button>
    </div>
  </nav>
  <main>
    <div class="head"><h2 id="pg-title">Today</h2><p id="pg-sub"></p></div>
    <div class="body" id="pg-body"></div>
  </main>
</div>

<!-- ===================== SHEET ===================== -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-in">
    <div class="sheet-hd"><h3 id="sheet-title">—</h3></div>
    <div class="sheet-bd" id="sheet-body"></div>
    <div class="sheet-ft" id="sheet-foot"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="./app.js"></script>
<script src="./pwa.js"></script>
</body>
</html>
