<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Taranis Console</title>

<!--
  Content Security Policy.
  connect-src is deliberately narrow: the app may only talk to your own n8n
  gateway and your own Supabase project. Add nothing else here without a reason.
  Replace the two placeholder origins at deploy time (see deploy.yml).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' https://quantcairo.app.n8n.cloud https://*.supabase.co wss://*.supabase.co;
  form-action 'none';
  frame-ancestors 'none';
  base-uri 'none';
">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Taranis Console — instrument-panel typography
   Display: Instrument Serif   Body: IBM Plex Sans   Data: IBM Plex Mono
   ============================================================ */
:root{
  --ink:#14181f;
  --ink-2:#3d454f;
  --ink-3:#6b7480;
  --paper:#f6f6f3;
  --card:#ffffff;
  --rule:#dcdcd5;
  --rule-2:#ebebe5;
  --accent:#1d4e89;
  --accent-soft:#e8eef6;
  --signal:#a8560c;      /* needs a person */
  --signal-soft:#fbf0e3;
  --good:#186b3d;
  --good-soft:#e7f2eb;
  --bad:#96122f;
  --bad-soft:#fbe9ec;
  --shadow:0 1px 2px rgba(20,24,31,.05),0 8px 24px -12px rgba(20,24,31,.18);
  --rail:44px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#eceae4; --ink-2:#b3b8c0; --ink-3:#7f8791;
    --paper:#101318; --card:#171b22; --rule:#2a2f38; --rule-2:#20242b;
    --accent:#7aa7dd; --accent-soft:#1a2534;
    --signal:#e0a262; --signal-soft:#2b2116;
    --good:#6dc191; --good-soft:#152720;
    --bad:#e78ba0;  --bad-soft:#2a161c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- Sign in ---------- */
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:100;padding:24px}
.gate-card{width:100%;max-width:380px}
.gate-mark{font-family:"Instrument Serif",serif;font-size:44px;line-height:1;letter-spacing:-.01em;margin:0 0 4px}
.gate-sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 32px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-quiet{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn-quiet:hover{background:var(--rule-2);opacity:1}
.btn-sm{padding:5px 11px;font-size:13px}
.gate-note{margin-top:20px;font-size:13px;color:var(--ink-3);line-height:1.55}

/* ---------- Shell ---------- */
#app{display:none;height:100%}
#app.on{display:grid;grid-template-columns:216px 1fr;grid-template-rows:100%}

nav{border-right:1px solid var(--rule);background:var(--card);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--rule-2)}
.brand h1{font-family:"Instrument Serif",serif;font-size:25px;margin:0;line-height:1;letter-spacing:-.01em}
.brand p{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 0}
.navlist{padding:10px 8px;flex:1}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;font-size:14px;color:var(--ink-2);margin-bottom:1px}
.navbtn:hover{background:var(--rule-2)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .ic{width:16px;text-align:center;font-size:13px;opacity:.8}
.navbtn .ct{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--signal);color:#fff;padding:1px 6px;border-radius:9px;font-weight:600}
@media (prefers-color-scheme:dark){.navbtn .ct{color:#171b22}}
.navfoot{padding:12px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--ink-3)}
.navfoot .who{display:block;color:var(--ink-2);font-weight:600;margin-bottom:2px;word-break:break-all}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline}

main{overflow-y:auto;display:flex;flex-direction:column}
.head{padding:22px 28px 14px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:5}
.head h2{font-family:"Instrument Serif",serif;font-size:30px;margin:0;line-height:1.05;letter-spacing:-.01em}
.head p{margin:5px 0 0;color:var(--ink-3);font-size:13.5px;max-width:64ch}
.body{padding:20px 28px 48px;flex:1}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}

/* ---------- Entry: action first, evidence indented in mono ---------- */
.entry{background:var(--card);border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;display:grid;grid-template-columns:var(--rail) 1fr;overflow:hidden;box-shadow:var(--shadow)}
.entry-rail{border-right:1px solid var(--rule-2);display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:7px;background:var(--rule-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.good{background:var(--good)} .dot.signal{background:var(--signal)} .dot.bad{background:var(--bad)} .dot.accent{background:var(--accent)}
.rail-n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:.06em}
.entry-main{padding:14px 16px}
.entry-act{font-size:15px;font-weight:600;margin:0 0 3px;line-height:1.35}
.entry-who{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.entry-who b{font-weight:600;color:var(--ink)}
.ev{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);line-height:1.65;padding-left:14px;border-left:2px solid var(--rule);margin:0}
.ev div{margin-bottom:1px}
.ev .k{color:var(--ink-3)}
.acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--rule-2);color:var(--ink-2);font-weight:500}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.signal{background:var(--signal-soft);color:var(--signal)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}

.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty p{margin:0 0 14px;font-size:14px}
.empty .big{font-family:"Instrument Serif",serif;font-size:22px;color:var(--ink-2);margin-bottom:6px}

/* ---------- Ask (chat) ---------- */
#ask-wrap{display:flex;flex-direction:column;height:100%}
#ask-log{flex:1;overflow-y:auto;padding:20px 28px}
.msg{max-width:78ch;margin-bottom:18px}
.msg .from{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.msg.me{margin-left:auto}
.msg.me .bub{background:var(--accent-soft);border-color:transparent}
.bub{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:13px 15px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.6}
.bub b{font-weight:600}
.bub a{color:var(--accent)}
.srcs{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule-2);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
#ask-bar{border-top:1px solid var(--rule);padding:12px 28px 18px;background:var(--paper);position:sticky;bottom:0}
#ask-row{display:flex;gap:8px;align-items:flex-end;max-width:900px}
#ask-in{flex:1;padding:11px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--card);resize:none;max-height:150px;font-size:14.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;max-width:900px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:14px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.typing{display:inline-flex;gap:3px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- Compose / modal ---------- */
.sheet{position:fixed;inset:0;background:rgba(20,24,31,.42);display:none;place-items:center;z-index:60;padding:20px}
.sheet.on{display:grid}
.sheet-in{background:var(--card);border-radius:10px;max-width:620px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,.4)}
.sheet-hd{padding:18px 22px 12px;border-bottom:1px solid var(--rule-2)}
.sheet-hd h3{font-family:"Instrument Serif",serif;font-size:23px;margin:0}
.sheet-bd{padding:18px 22px}
.sheet-ft{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--rule-2)}
.ta{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);resize:vertical;min-height:150px;font-size:14px;line-height:1.6}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:7px;font-size:14px;z-index:90;transition:transform .22s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad)}

.banner{background:var(--signal-soft);border:1px solid var(--signal);color:var(--signal);padding:9px 14px;border-radius:6px;font-size:13px;margin-bottom:16px}
.banner b{font-weight:600}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  #app.on{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);align-items:center}
  .brand{border-bottom:0;border-right:1px solid var(--rule-2);padding:12px 14px;flex:none}
  .brand h1{font-size:19px} .brand p{display:none}
  .navlist{display:flex;padding:8px;flex:none}
  .navbtn{white-space:nowrap;margin:0 1px 0 0}
  .navbtn .ic{display:none}
  .navfoot{display:none}
  .head{padding:16px 18px 12px} .head h2{font-size:24px}
  .body,#ask-log,#ask-bar{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>

<!-- ===================== SIGN IN ===================== -->
<div id="gate">
  <div class="gate-card">
    <h1 class="gate-mark">Taranis</h1>
    <p class="gate-sub">Fundraising console</p>
    <label class="field"><span>Work email</span>
      <input id="gate-email" type="email" autocomplete="username" placeholder="you@taranis.net"></label>
    <button class="btn" id="gate-go" style="width:100%">Send sign-in link</button>
    <p class="gate-note" id="gate-note">A one-time link goes to your inbox. Only addresses on the allow list can sign in.</p>
    <p class="gate-note"><button class="linkish" id="gate-demo">Open the sample console instead</button> — sample data, nothing connected.</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <nav>
    <div class="brand"><h1>Taranis</h1><p>Console</p></div>
    <div class="navlist" id="navlist"></div>
    <div class="navfoot">
      <span class="who" id="who">—</span>
      <button class="linkish" id="signout">Sign out</button>
    </div>
  </nav>
  <main>
    <div class="head"><h2 id="pg-title">Today</h2><p id="pg-sub"></p></div>
    <div class="body" id="pg-body"></div>
  </main>
</div>

<!-- ===================== SHEET ===================== -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-in">
    <div class="sheet-hd"><h3 id="sheet-title">—</h3></div>
    <div class="sheet-bd" id="sheet-body"></div>
    <div class="sheet-ft" id="sheet-foot"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="./app.js"></script>
</body>
</html>
